kind = "web"
previewPath = "/"
title = "AIcreatesAI"
version = "1.0.0"
id = "artifacts/web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22333

[services.development]
run = "pnpm --filter @workspace/web run dev"

# Production: static fallback served from the autoscale deployment at /.
# The canonical marketing site is hosted on GitHub Pages at
# https://www.aicreates.ai (deployed by .github/workflows/deploy.yml) and
# DNS only points there. This block exists so Replit Publishing has a
# runnable production target for every artifact (otherwise the publish
# dialog shows "Could not find run command" and blocks publish). The
# *.replit.app/ fallback is harmless because no DNS resolves to it.
[services.production]
build = [ "pnpm", "--filter", "@workspace/web", "run", "build" ]
publicDir = "artifacts/web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22333"
BASE_PATH = "/"
