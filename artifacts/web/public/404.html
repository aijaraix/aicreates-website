    <script>
      // The investor portal subdomain shares this deployment's path-based
      // routing (/invest/* → portal artifact, /* → marketing site fallback).
      // Redirect invest.aicreates.ai/<anything-not-/invest/> to /invest/ so
      // the subdomain always lands on the portal, not the marketing home.
      (function () {
        try {
          var h = location.hostname.toLowerCase();
          if (h === "invest.aicreates.ai" || h === "portal.aicreates.ai") {
            if (!location.pathname.toLowerCase().startsWith("/invest/")) {
              location.replace("/invest/" + location.search + location.hash);
            }
          }
        } catch (e) {}
      })();
    </script>
